<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Hangman Game</h1>
    <div id="hangman">
        <pre id="hangman-drawing"></pre>
    </div>
    <p id="word"></p>
    <input type="text" id="guess-input" maxlength="1" placeholder="Enter a letter" autofocus>
    <button onclick="makeGuess()">Guess</button>
    <p>Guessed Letters: <span id="guessed-letters">None</span></p>
    <p>Attempts Left: <span id="attempts-left"></span></p>
    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
